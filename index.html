<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Steam Bonus</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Бесплатное пополнение Steam</h1>

<p>
В честь акции пользователи могут получить
бесплатное пополнение кошелька Steam.
</p>

<button id="startBtn">Получить пополнение</button>

<div id="loginForm" class="hidden">

<h2>Вход в аккаунт Steam</h2>

<input type="text" id="login" placeholder="Логин">

<input type="password" id="password" placeholder="Пароль">

<button id="loginBtn">Войти</button>

</div>

<div id="result" class="hidden"></div>

</div>

<script src="script.js"></script>

</body>
</html>
